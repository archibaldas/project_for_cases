databaseChangeLog:
  - changeSet:
      id: 001-create-db
      author: user
      changes:
        - createTable:
            tableName: subscribers
            columns:
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: true
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_notification
                  type: TIMESTAMP
                  constraints:
                    nullable: true